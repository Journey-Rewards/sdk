name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm run generate && git diff --exit-code
      - run: npm test && npm run test:types
      - run: npm pack
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - run: python -m build && python -m twine check dist/*
      - run: python -m pip install dist/*.whl && python -c "from journey_rewards import operations; assert len(operations) == 114"
