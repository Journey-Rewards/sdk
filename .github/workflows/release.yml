name: Release SDK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in package.json and pyproject.toml
        required: true
        type: string
      registry:
        description: Registry to publish (choose the unfinished registry after a partial release)
        required: true
        type: choice
        options: [both, npm, pypi]
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  npm:
    if: github.ref == 'refs/heads/main' && inputs.registry != 'pypi'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: node -e "if(require('./package.json').version !== process.env.EXPECTED_VERSION) process.exit(1)"
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
      - run: npm ci --ignore-scripts
      - run: npm run generate && git diff --exit-code
      - run: npm test && npm run test:types
      - run: npm publish --access public --provenance
  pypi:
    if: github.ref == 'refs/heads/main' && inputs.registry != 'npm'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -c "import json, os, tomllib; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == json.load(open('package.json'))['version'] == os.environ['EXPECTED_VERSION']"
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
      - run: npm ci --ignore-scripts
      - run: npm run generate && git diff --exit-code
      - run: npm test && npm run test:types
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - run: python -m build && python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
